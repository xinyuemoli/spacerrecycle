[package]
name = "spacerrecycle"
version = "0.1.0"
description = "Windows disk space reclamation tool"
edition = "2021"
rust-version = "1.90"

[lib]
name = "spacerrecycle_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ignore = "0.4"
rayon = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Registry",
] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
