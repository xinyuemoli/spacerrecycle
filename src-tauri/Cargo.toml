[package]
name = "spacerrecycle"
version = "1.0.7"
description = "Windows disk space reclamation tool"
edition = "2021"
rust-version = "1.90"

[lib]
name = "spacerrecycle_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ignore = "0.4"
rayon = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_Networking_WinHttp",
  "Win32_Storage_Packaging_Appx",
  "Services_Store",
] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[features]
# Unlocks the paid features without asking the Store, for testing.
#
# **Off by default, and that is the whole point.** The override used to be a
# config-file flag that worked in every build, which meant any user could open
# `%APPDATA%\SpaceRecycle\config.json` in Notepad, add one line, and receive
# every paid feature for free - in the Store build, with no prompt and nothing on
# screen to say so. The gate needs to be one an ordinary user cannot pass, and
# "recompile the binary" is that gate while a JSON key is not.
#
# Build with it for a test package:
#
#     cargo build --release --features dev-entitlement
#     .\scripts\build-msix.ps1 -Version X ... -DevEntitlement
#
# The lock screen and the entitlement detail both say the override is on, so a
# build carrying it cannot be mistaken for an ordinary one.
dev-entitlement = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
